<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geelong Premium Network</title>

<style>
body{
  font-family:-apple-system,Arial;
  background:linear-gradient(135deg,#0f172a,#111827);
  padding:6px;
  color:#fff;
  max-width:430px;
  margin:auto;
}

h2{
  text-align:center;
  margin-bottom:6px;
  font-size:18px;
}

input,select{
  width:100%;
  padding:14px;
  margin:3px 0;
  font-size:16px;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}

select{
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}

input:disabled{
  background:#e5e7eb;
  color:#9ca3af;
  cursor:not-allowed;
}

button{
  padding:12px;
  margin:2px;
  font-size:15px;
  border-radius:10px;
  border:none;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#d1d5db;
  color:#9ca3af;
  cursor:not-allowed;
}

.glow{
  background:#facc15!important;
  color:#000!important;
  box-shadow:0 0 8px #facc15;
}

.section{
  margin-top:6px;
}

h3{
  margin:3px 0;
  font-size:14px;
}

.row{
  display:flex;
  gap:4px;
}

.row button{
  flex:1;
}

.twoCol{
  display:flex;
  gap:6px;
}

.twoCol input{
  flex:1;
}

.threeCol{
  display:flex;
  gap:4px;
}

.threeCol input{
  flex:1;
}

.threeCol button{
  flex:1;
}

.fourCol{
  display:flex;
  gap:4px;
}

.fourCol button{
  flex:1;
}

.depositRow{
  display:flex;
  gap:4px;
  margin-top:3px;
}

.depositRow button{
  flex:1;
}

.depositAmountBox{
  display:flex;
  align-items:center;
  background:#fff;
  border-radius:10px;
  padding:0 8px;
  flex:1;
}

.depositAmountBox span{
  color:#000;
  font-weight:bold;
  margin-right:4px;
}

.depositAmountBox input{
  border:none;
  outline:none;
  padding:12px;
  margin:0;
  flex:1;
}

.paymentLinkRow{
  display:flex;
  gap:4px;
  margin-top:3px;
}

.paymentLinkRow input{
  flex:1;
}

.priceRow{
  display:flex;
  gap:4px;
  margin-top:3px;
  align-items:center;
}

.priceRow button{
  flex:0.8;
}

.priceBox{
  display:flex;
  align-items:center;
  background:#fff;
  border-radius:10px;
  padding:0 8px;
  flex:1;
}

.priceBox span{
  color:#000;
  font-weight:bold;
  margin-right:4px;
}

.priceBox input{
  border:none;
  outline:none;
  padding:12px;
  margin:0;
  flex:1;
}

.autocomplete-container{
  position:relative;
  width:100%;
}

.autocomplete-list{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  max-height:250px;
  overflow-y:auto;
  z-index:1000;
  display:none;
  margin-top:-4px;
}

.autocomplete-list.active{
  display:block;
}

.autocomplete-item{
  padding:12px 14px;
  cursor:pointer;
  border-bottom:1px solid #eee;
  color:#333;
  font-size:14px;
  transition:background 0.2s;
}

.autocomplete-item:hover{
  background:#f0f0f0;
}

.autocomplete-item:last-child{
  border-bottom:none;
}

.pac-icon{
  display:inline-block;
  width:16px;
  height:16px;
  margin-right:8px;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232563eb"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 14 8.67 14 9.5s.67 1.5 1.5 1.5z"/></svg>');
  background-size:contain;
}
</style>
</head>

<body>

<h2>GEELONG PREMIUM NETWORK</h2>

<!-- NAME + PHONE -->
<div class="twoCol">
  <input id="name" placeholder="Passenger Name">
  <input id="phone" type="tel" inputmode="numeric" placeholder="Phone Number">
</div>

<!-- PICKUP -->
<div class="autocomplete-container">
  <input id="pickup" placeholder="Pickup Location" autocomplete="off">
  <div id="pickupList" class="autocomplete-list"></div>
</div>

<!-- DROP -->
<div class="autocomplete-container">
  <input id="drop" placeholder="Drop Location" autocomplete="off">
  <div id="dropList" class="autocomplete-list"></div>
</div>

<!-- PICKUP TIME -->
<div class="section">

<h3>Pickup Time</h3>

<div class="row">
  <button id="quickBtn" onclick="setTime('Quick')">Quick</button>
  <button id="readyBtn" onclick="setTime('Ready Now')">Ready Now</button>
  <button id="laterBtn" onclick="setTime('Later')">Later</button>
</div>

<div class="threeCol">
  <input id="date" type="date" disabled>
  <input id="time" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" disabled>
  <button id="amBtn" onclick="setAMPM('AM')" disabled>AM</button>
  <button id="pmBtn" onclick="setAMPM('PM')" disabled>PM</button>
</div>

<div id="timeSelected">Selected: None</div>

</div>

<!-- PASSENGERS -->
<div class="section">

<h3>Passengers & Vehicle</h3>

<div class="threeCol">
  <input id="adults" type="tel" inputmode="numeric" placeholder="Adults">
  <input id="kids" type="tel" inputmode="numeric" placeholder="Kids">
  <input id="luggage" type="tel" inputmode="numeric" placeholder="Luggage">
</div>

<div class="fourCol" style="margin-top:3px;">
  <button id="sedanBtn" onclick="setVehicle('Sedan')">Sedan</button>
  <button id="suvBtn" onclick="setVehicle('SUV')">SUV</button>
  <button id="luxBtn" onclick="setVehicle('Luxury')">Luxury</button>
  <button id="maxiBtn" onclick="setVehicle('MAXI')">MAXI</button>
</div>

<div id="vehicleSelected">Selected: None</div>

</div>

<!-- PAYMENT -->
<div class="section">

<h3>Payment & Price</h3>

<div class="fourCol">
  <button id="cabBtn" onclick="togglePayment('Cabcharge')">Cabcharge</button>
  <button id="mptpBtn" onclick="togglePayment('MPTP')">MPTP</button>
  <button id="cardBtn" onclick="togglePayment('Debit/Credit')">Debit/Credit</button>
  <button id="cashBtn" onclick="togglePayment('Cash')">Cash</button>
</div>

<div class="depositRow">

  <button id="depositBtn" onclick="togglePayment('Deposit')">Deposit</button>

  <div class="depositAmountBox">
    <span>$</span>
    <input id="depositAmount" type="tel" inputmode="numeric" placeholder="Amount" disabled>
  </div>

</div>

<div class="paymentLinkRow">
  <input id="depositLink" placeholder="Deposit Payment Link" disabled>
</div>

<div id="paymentSelected">Selected: None</div>

<div class="priceRow">

  <button id="meterBtn" onclick="setPriceType('Meter Fare')">Meter Fare</button>
  <button id="setBtn" onclick="setPriceType('Set Price')">Set Price</button>

  <div class="priceBox">
    <span>$</span>
    <input id="price" type="tel" inputmode="numeric" placeholder="Enter amount" disabled>
  </div>

</div>

<div id="priceSelected">Selected: None</div>

</div>

<!-- ACTION BUTTONS -->
<div class="section">

<button style="width:100%; background:#10b981;" onclick="dispatch()">
DISPATCH
</button>

<div style="display:flex; gap:8px;">

  <button style="flex:1;" onclick="sendQuote()">
  Send Quote
  </button>

  <button style="flex:1;" onclick="sendConfirmation()">
  Send Confirmation
  </button>

  <button style="flex:1; background:#8b5cf6;" onclick="sendFollowUp()">
  Follow Up
  </button>

</div>

</div>

<!-- JOB HISTORY -->
<div class="section">
<h3>Recent Jobs</h3>
<select id="jobHistory" onchange="loadSelectedJob()">
  <option value="">-- Select Previous Job --</option>
</select>
</div>

<script>
const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY_HERE";

let jobCount = localStorage.getItem("jobCount");
jobCount = jobCount ? parseInt(jobCount) : 1000;
let selectedVehicle="None", selectedTime="None", selectedAMPM="None", paymentArray=[], priceType="None";
let autocompleteService, placesService, map;

function initializeGoogleMaps() {
  if (!window.google) { console.error("Google Maps API not loaded"); return;}
  autocompleteService = new google.maps.places.AutocompleteService();
  map = new google.maps.Map(document.createElement('div'));
  placesService = new google.maps.places.PlacesService(map);
  setupAutocomplete('pickup', 'pickupList');
  setupAutocomplete('drop', 'dropList');
}

function setupAutocomplete(inputId, listId) {
  const inputElement = document.getElementById(inputId);
  const listElement = document.getElementById(listId);
  let debounceTimer;
  inputElement.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const value = this.value.trim();
    if (value.length < 2) { listElement.classList.remove('active'); return; }
    debounceTimer = setTimeout(() => {
      getPlacePredictions(value, (predictions) => {
        listElement.innerHTML = '';
        predictions.forEach((prediction) => {
          const item = document.createElement('div');
          item.className = 'autocomplete-item';
          item.innerHTML = `<span class="pac-icon">📍</span>${prediction.description}`;
          item.addEventListener('click', () => {
            let formatted = prediction.description.replace(/\s*,?\s*Australia\s*$/i, '').replace(/\s*,?\s*$/, '');
            inputElement.value = formatted;
            listElement.classList.remove('active');
          });
          listElement.appendChild(item);
        });
        if (predictions.length > 0) listElement.classList.add('active');
        else listElement.classList.remove('active');
      });
    }, 300);
  });
  inputElement.addEventListener('blur', function() {
    setTimeout(() => {listElement.classList.remove('active');}, 200);
  });
}

function getPlacePredictions(input, callback) {
  autocompleteService.getPlacePredictions({
    input,
    componentRestrictions: { country: 'au' },
    types: ['geocode', 'establishment']
  }, (predictions, status) => {
    if (status === google.maps.places.PlacesServiceStatus.OK && predictions) callback(predictions.slice(0, 5));
    else callback([]);
  });
}

function titleCase(str){return str.toLowerCase().split(' ').filter(w=>w).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');}
function getTodayDate() {const today = new Date();const year = today.getFullYear();const month = String(today.getMonth() + 1).padStart(2, '0');const day = String(today.getDate()).padStart(2, '0');return `${year}-${month}-${day}`;}
function formatDateDisplay(dateStr) {if(!dateStr) return "Today";const today = new Date();const todayStr = getTodayDate();if(dateStr === todayStr) return "Today";const date = new Date(dateStr + 'T00:00:00');const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };return date.toLocaleDateString('en-AU', options);}
function pluralize(count, singular, plural) { count = parseInt(count); if(count === 1) return `${count} ${singular}`; return `${count} ${plural}`; }

document.getElementById("time").addEventListener("input", function(e){
  let value = e.target.value.replace(/[^0-9]/g, "");
  if(value.length > 4) value = value.slice(0, 4);
  if(value.length <= 2){ e.target.value = value; }
  else { e.target.value = value.slice(0, 2) + ":" + value.slice(2);}
  updateTimeDisplay();
});

function setTime(t){
  if(selectedTime === t){
    selectedTime="None";
    ["quickBtn","readyBtn","laterBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});
  }
  else{
    selectedTime=t;
    ["quickBtn","readyBtn","laterBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});
    if(t==="Quick") quickBtn.classList.add("glow");
    if(t==="Ready Now") readyBtn.classList.add("glow");
    if(t==="Later") laterBtn.classList.add("glow");
  }
  let isLater = selectedTime === "Later";
  document.getElementById("date").disabled = !isLater;
  document.getElementById("time").disabled = !isLater;
  document.getElementById("amBtn").disabled = !isLater;
  document.getElementById("pmBtn").disabled = !isLater;
  if(!isLater){
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    selectedAMPM = "None";
    document.getElementById("amBtn").classList.remove("glow");
    document.getElementById("pmBtn").classList.remove("glow");
  }
  updateTimeDisplay();
}

function setAMPM(period){
  if(selectedAMPM === period){
    selectedAMPM="None";
    amBtn.classList.remove("glow");
    pmBtn.classList.remove("glow");
  }
  else{
    selectedAMPM=period;
    amBtn.classList.remove("glow");
    pmBtn.classList.remove("glow");
    if(period==="AM") amBtn.classList.add("glow");
    if(period==="PM") pmBtn.classList.add("glow");
  }
  updateTimeDisplay();
}

function updateTimeDisplay(){
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let display="Selected: "+selectedTime;
  if(date) display+=" | Date: "+date;
  if(time) display+=" | Time: "+time;
  if(selectedAMPM!=="None") display+=" "+selectedAMPM;
  timeSelected.innerText=display;
}

document.getElementById("date").addEventListener("change", updateTimeDisplay);
document.getElementById("time").addEventListener("change", updateTimeDisplay);

function setVehicle(v){
  if(selectedVehicle === v){
    selectedVehicle="None";
    ["sedanBtn","suvBtn","luxBtn","maxiBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});
  }
  else{
    selectedVehicle=v;
    ["sedanBtn","suvBtn","luxBtn","maxiBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});
    if(v==="Sedan") sedanBtn.classList.add("glow");
    if(v==="SUV") suvBtn.classList.add("glow");
    if(v==="Luxury") luxBtn.classList.add("glow");
    if(v==="MAXI") maxiBtn.classList.add("glow");
  }
  vehicleSelected.innerText="Selected: "+selectedVehicle;
}

function togglePayment(p){
  let map={"Cabcharge":"cabBtn","MPTP":"mptpBtn","Debit/Credit":"cardBtn","Cash":"cashBtn","Deposit":"depositBtn"};
  let btn=document.getElementById(map[p]);
  let depositLinkBox=document.getElementById("depositLink");
  let depositAmountBox=document.getElementById("depositAmount");

  if(paymentArray.includes(p)){
    paymentArray=paymentArray.filter(x=>x!==p);
    btn.classList.remove("glow");
    if(p==="Deposit"){
      depositLinkBox.disabled=true;
      depositLinkBox.value="";
      depositAmountBox.disabled=true;
      depositAmountBox.value="";
    }
  }
  else{
    if(paymentArray.length<2){
      paymentArray.push(p);
      btn.classList.add("glow");
      if(p==="Deposit"){
        depositLinkBox.disabled=false;
        depositAmountBox.disabled=false;
      }
    }else{
      alert("Max 2 payments");
    }
  }
  paymentSelected.innerText=paymentArray.join(", ")||"None";
}

function setPriceType(p){
  if(priceType === p){
    priceType="None";
    meterBtn.classList.remove("glow");
    setBtn.classList.remove("glow");
    document.getElementById("price").disabled=true;
    document.getElementById("price").value="";
  }
  else{
    priceType=p;
    meterBtn.classList.remove("glow");
    setBtn.classList.remove("glow");
    if(p==="Meter Fare"){
      meterBtn.classList.add("glow");
      document.getElementById("price").disabled=true;
      document.getElementById("price").value="";
    }
    if(p==="Set Price"){
      setBtn.classList.add("glow");
      document.getElementById("price").disabled=false;
    }
  }
  priceSelected.innerText="Selected: "+priceType;
}

function saveJobToHistory(){
  let name = titleCase(document.getElementById("name").value);
  let phone=document.getElementById("phone").value;
  let pickup=titleCase(document.getElementById("pickup").value);
  let drop=titleCase(document.getElementById("drop").value);
  let adults=document.getElementById("adults").value;
  let kids=document.getElementById("kids").value;
  let luggage=document.getElementById("luggage").value;
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let price=document.getElementById("price").value;
  let depositLink=document.getElementById("depositLink").value;
  let depositAmount=document.getElementById("depositAmount").value;

  let job = {
    id: jobCount,
    name, phone, pickup, drop, adults, kids, luggage,
    vehicle:selectedVehicle,
    payment:paymentArray.slice(),
    time:selectedTime,
    date,
    timeInput:time,
    ampm:selectedAMPM,
    priceType,
    price,
    depositLink,
    depositAmount,
    timestamp: new Date().toLocaleString()
  };

  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  jobs.unshift(job);
  jobs = jobs.slice(0, 5);
  localStorage.setItem("jobHistory", JSON.stringify(jobs));
  updateJobHistoryDropdown();
}

function updateJobHistoryDropdown(){
  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  let select = document.getElementById("jobHistory");
  select.innerHTML = '<option value="">-- Select Previous Job --</option>';
  jobs.forEach((job, index) => {
    let option = document.createElement("option");
    option.value = index;
    option.textContent = `${job.name} - ${job.pickup} to ${job.drop}`;
    select.appendChild(option);
  });
}

function loadSelectedJob(){
  let select = document.getElementById("jobHistory");
  let index = select.value;
  if(index === "") return;
  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  let job = jobs[index];
  if(!job) return;

  document.getElementById("name").value = job.name || "";
  document.getElementById("phone").value = job.phone || "";
  document.getElementById("pickup").value = job.pickup || "";
  document.getElementById("drop").value = job.drop || "";
  document.getElementById("adults").value = job.adults || "";
  document.getElementById("kids").value = job.kids || "";
  document.getElementById("luggage").value = job.luggage || "";
  document.getElementById("date").value = job.date || "";
  document.getElementById("time").value = job.timeInput || "";
  document.getElementById("price").value = job.price || "";
  document.getElementById("depositLink").value = job.depositLink || "";
  document.getElementById("depositAmount").value = job.depositAmount || "";

  setVehicle(job.vehicle || "None");
  setTime(job.time || "None");
  setAMPM(job.ampm || "None");
  setPriceType(job.priceType || "None");

  paymentArray = job.payment || [];
  ["cabBtn","cardBtn","mptpBtn","cashBtn","depositBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});

  paymentArray.forEach(p=>{
    if(p==="Cabcharge") cabBtn.classList.add("glow");
    if(p==="Debit/Credit") cardBtn.classList.add("glow");
    if(p==="MPTP") mptpBtn.classList.add("glow");
    if(p==="Cash") cashBtn.classList.add("glow");
    if(p==="Deposit"){
      depositBtn.classList.add("glow");
      document.getElementById("depositLink").disabled=false;
      document.getElementById("depositAmount").disabled=false;
    }
  });

  paymentSelected.innerText=paymentArray.join(", ")||"None";
  select.value = "";
}

function dispatch(){
  let name = titleCase(document.getElementById("name").value);
  let phone=document.getElementById("phone").value;
  let pickup=titleCase(document.getElementById("pickup").value);
  let drop=titleCase(document.getElementById("drop").value);
  let adults=document.getElementById("adults").value;
  let kids=document.getElementById("kids").value;
  let luggage=document.getElementById("luggage").value;
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let price=document.getElementById("price").value;
  let depositAmount=document.getElementById("depositAmount").value;

  if(selectedTime === "Later" && !date && time) {date = getTodayDate();}

  let dateFormatted = formatDateDisplay(date);
  let timeSection = selectedTime === "Later" && date && time? `🪧 *Pickup Time - ${selectedTime}*\n📅 *Date: ${dateFormatted}*\n⏱️ *Time: ${time} ${selectedAMPM}*`: `🪧 *Pickup Time - ${selectedTime}*`;

  let passengersSection = `👥 Adults: ${adults || "None"}`;
  if(kids) passengersSection += `\n👥 Kids: ${kids}`;
  if(luggage) passengersSection += `\n👜 Luggage: ${luggage}`;

  let paymentSection = `💳 ${paymentArray.join(", ")}`;
  if(paymentArray.includes("Deposit")){
    paymentSection += `\n💳 *Deposit Required - $${depositAmount}*`;
  }

  let message=`🚖 TAXI DISPATCH\n🆔 JOB-${jobCount}\n⏰ ${new Date().toLocaleString()}\n${timeSection}\n\n👤 ${name}\n📞 ${phone}\n\n🚗 ${selectedVehicle}\n${paymentSection}\n💲 ${priceType} ${price ? "$"+price : ""}\n${passengersSection}\n\n📍 Pickup: ${pickup}\n📍 Drop: ${drop}`;

  navigator.clipboard.writeText(message);
  saveJobToHistory();
  alert("Copied ✔");
  jobCount++;
  localStorage.setItem("jobCount", jobCount);
  window.open("https://chat.whatsapp.com/Fiu6m7Uvlcz0TN49jkV30D?mode=gi_t","_blank");
}

function sendQuote(){
  let name = titleCase(document.getElementById("name").value);
  let phone = document.getElementById("phone").value.replace(/\s+/g,'');
  let pickup = titleCase(document.getElementById("pickup").value);
  let drop = titleCase(document.getElementById("drop").value);
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;
  let adults = document.getElementById("adults").value;
  let kids = document.getElementById("kids").value;
  let luggage = document.getElementById("luggage").value;
  let price = document.getElementById("price").value;

  if(!name || !phone) {alert("Please enter Passenger Name and Phone Number");return;}
  if(!price) {alert("Please enter price for quote");return;}

  if(selectedTime === "Later"){
    if(!date || !time){
      alert("Please select date and time for Later pickup");
      return;
    }
  }

  let timeDisplay = selectedTime === "Later" && date && time ? `${formatDateDisplay(date)}, ${time} ${selectedAMPM}` : "ASAP";
  let passengerInfo = "";
  let passengerArray = [];
  if(adults) {passengerArray.push(pluralize(adults, "Adult", "Adults"));}
  if(kids) {passengerArray.push(pluralize(kids, "Kid", "Kids"));}
  passengerInfo = passengerArray.join(", ");

  let msg = `Hi ${name},\n\nThank you for your inquiry.\n\nDate & Time: ${timeDisplay}\nPickup Address: ${pickup}\nDrop-off Address: ${drop}\nPassengers: ${passengerInfo}\nVehicle: ${selectedVehicle}\nEstimated Fare: $${price} GST Inclusive\n\nTo confirm your booking or discuss price, simply reply to this message or give us a call.\n\nFor Bookings & Inquiries:\n📞 0420 303 581\n📞 0450 678 194\n🌎 www.geelongcitytaxicab.com.au`;

  navigator.clipboard.writeText(msg);
  saveJobToHistory();
  window.location.href="sms:"+phone+"&body="+encodeURIComponent(msg);
}

function sendConfirmation(){
  let name = titleCase(document.getElementById("name").value);
  let phone = document.getElementById("phone").value.replace(/\s+/g,'');
  let pickup = titleCase(document.getElementById("pickup").value);
  let drop = titleCase(document.getElementById("drop").value);
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;
  let adults = document.getElementById("adults").value;
  let kids = document.getElementById("kids").value;
  let luggage = document.getElementById("luggage").value;
  let depositLink = document.getElementById("depositLink").value;
  let depositAmount = document.getElementById("depositAmount").value;

  if(!name || !phone) {alert("Please enter Passenger Name and Phone Number");return;}

  if(paymentArray.includes("Deposit")){
    if(!date || !time){
      alert("Please select date and time for deposit booking");
      return;
    }
    if(!depositLink || !depositAmount){
      alert("Please enter deposit link and amount");
      return;
    }
  }

  if(selectedTime === "Later"){
    if(!date || !time){
      alert("Please select date and time for Later pickup");
      return;
    }
  }

  if(selectedTime === "Later" && !date && time) {date = getTodayDate();}

  let msg;

  if(paymentArray.includes("Deposit") && depositLink && depositAmount){
    let dateDisplay = formatDateDisplay(date);
    let passengerInfo = "";
    let passengerArray = [];
    if(adults) {passengerArray.push(pluralize(adults, "Adult", "Adults"));}
    if(kids) {passengerArray.push(pluralize(kids, "Kid", "Kids"));}
    passengerInfo = passengerArray.join(", ");

    msg =`Hi ${name},\n\nYour taxi booking has been confirmed.\n\nDate & Time: ${dateDisplay}, ${time} ${selectedAMPM}\nPickup Address: ${pickup}\nDrop-off Address: ${drop}\nPassengers: ${passengerInfo}\nVehicle: ${selectedVehicle}\n\nPlease use the link below to make the upfront payment of *$${depositAmount}*.\n\n${depositLink}\n\nPlease contact us immediately if any changes are required.\n\nFor Bookings & Inquiries:\n📞 0420 303 581\n📞 0450 678 194\n🌎 www.geelongcitytaxicab.com.au`;
  }
  else if(selectedTime === "Later" && date && time) {
    let dateDisplay = formatDateDisplay(date);
    let passengerInfo = "";
    let passengerArray = [];
    if(adults) {passengerArray.push(pluralize(adults, "Adult", "Adults"));}
    if(kids) {passengerArray.push(pluralize(kids, "Kid", "Kids"));}
    passengerInfo = passengerArray.join(", ");
    let luggageInfo = "";
    if(luggage) {luggageInfo = "\nLuggage: " + pluralize(luggage, "Bag", "Bags");}

    msg =`Hi ${name},\n\nYour taxi booking has been Confirmed.\n\nDate & Time: ${dateDisplay}, ${time} ${selectedAMPM}\nPickup Address: ${pickup}\nDrop-off Address: ${drop}\nPassengers: ${passengerInfo}${luggageInfo}\nVehicle: ${selectedVehicle}\n\nPlease contact us immediately if any changes are required.\n\nThank you for choosing our service.\n\nFor Bookings & Inquiries:\n📞 0420 303 581\n📞 0450 678 194\n🌎 www.geelongcitytaxicab.com.au`;
  } else {
    msg =`Hi ${name},\n\nYour Taxi booking is Confirmed.\n\nPickup Address: ${pickup}\nDrop-off Address: ${drop}\n\nYour driver will be there shortly.\n\nThank you for choosing our service.\n\nFor Bookings & Inquiries:\n📞 0420 303 581\n📞 0450 678 194\n🌎 www.geelongcitytaxicab.com.au`;
  }

  window.location.href="sms:"+phone+"&body="+encodeURIComponent(msg);
}

  window.location.href="sms:"+phone+"&body="+encodeURIComponent(msg);
}
