<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geelong Premium Network</title>
<style>
body {
  font-family: -apple-system, Arial;
  background: linear-gradient(135deg, #0f172a, #111827);
  padding: 10px;
  color: #fff;
  max-width: 430px;
  margin: auto;
}
h2 { text-align: center; margin-bottom: 12px; font-size: 18px; }
input, select { width:100%;padding:14px;margin:6px 0;font-size:16px;border-radius:10px;border:none;box-sizing:border-box;}
select { background:#2563eb; color:#fff; cursor:pointer; }
input:disabled { background:#e5e7eb;color:#9ca3af;cursor:not-allowed; }
button {padding:12px;margin:5px 3px;font-size:15px;border-radius:10px;border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;}
button:disabled {background:#d1d5db;color:#9ca3af;cursor:not-allowed;}
.glow {background: #facc15 !important;color: #000 !important;box-shadow: 0 0 10px #facc15;}
.section { margin-top: 10px; }
h3 { margin: 6px 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row button { flex: 1; }
.twoCol {display: flex;gap: 8px;}
.twoCol input { flex: 1; }
.threeCol {display: flex;gap: 6px;}
.threeCol input { flex: 1; }
.threeCol button { flex: 0.6; }
.priceBox {display:flex;align-items:center;background:#fff;border-radius:10px;padding:0 10px;}
.priceBox span {color:#000;font-weight:bold;}
.priceBox input {border:none;outline:none;padding:12px;}
.autocomplete-container { position: relative;width: 100%; }
.autocomplete-list {position: absolute;top: 100%;left: 0;right: 0;background: #fff;border: 1px solid #ddd;border-radius: 8px;max-height: 250px;overflow-y: auto;z-index: 1000;display: none; margin-top: -6px;}
.autocomplete-list.active {display: block;}
.autocomplete-item {padding: 12px 14px;cursor: pointer;border-bottom: 1px solid #eee;color: #333;font-size: 14px;transition: background 0.2s;}
.autocomplete-item:hover {background: #f0f0f0;}
.autocomplete-item:last-child {border-bottom: none;}
.pac-icon {display:inline-block;width:16px;height:16px;margin-right:8px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232563eb"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5z"/></svg>');background-size: contain;}
</style>
</head>
<body>
<h2>GEELONG PREMIUM NETWORK</h2>
<!-- NAME + PHONE -->
<div class="twoCol">
  <input id="name" placeholder="Passenger Name">
  <input id="phone" type="tel" inputmode="numeric" placeholder="Phone Number">
</div>
<!-- PICKUP ADDRESS - FULL ROW -->
<div class="autocomplete-container">
  <input id="pickup" placeholder="Pickup Location" autocomplete="off">
  <div id="pickupList" class="autocomplete-list"></div>
</div>
<!-- DROP ADDRESS - FULL ROW -->
<div class="autocomplete-container">
  <input id="drop" placeholder="Drop Location" autocomplete="off">
  <div id="dropList" class="autocomplete-list"></div>
</div>
<!-- PASSENGERS: Adults, Kids, Luggage -->
<div class="threeCol">
  <input id="adults" type="tel" inputmode="numeric" placeholder="Adults">
  <input id="kids" type="tel" inputmode="numeric" placeholder="Kids">
  <input id="luggage" type="tel" inputmode="numeric" placeholder="Luggage">
</div>
<!-- PICKUP TIME -->
<div class="section">
<h3>Pickup Time</h3>
<div class="row">
  <button id="quickBtn" onclick="setTime('Quick')">Quick</button>
  <button id="readyBtn" onclick="setTime('Ready Now')">Ready Now</button>
  <button id="laterBtn" onclick="setTime('Later')">Later</button>
</div>
<div class="threeCol">
  <input id="date" type="date" disabled>
  <input id="time" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" disabled>
  <button id="amBtn" onclick="setAMPM('AM')" disabled>AM</button>
  <button id="pmBtn" onclick="setAMPM('PM')" disabled>PM</button>
</div>
<div id="timeSelected">Selected: None</div>
</div>
<!-- VEHICLE -->
<div class="section">
<h3>Vehicle</h3>
<div class="row">
  <button id="sedanBtn" onclick="setVehicle('Sedan')">Sedan</button>
  <button id="suvBtn" onclick="setVehicle('SUV')">SUV</button>
  <button id="luxBtn" onclick="setVehicle('Luxury')">Luxury</button>
  <button id="maxiBtn" onclick="setVehicle('MAXI')">MAXI</button>
</div>
<div id="vehicleSelected">Selected: None</div>
</div>
<!-- PAYMENT -->
<div class="section">
<h3>Payment</h3>
<div class="row">
  <button id="cabBtn" onclick="togglePayment('Cabcharge')">Cabcharge</button>
  <button id="cardBtn" onclick="togglePayment('Debit/Credit')">Debit/Credit</button>
  <button id="mptpBtn" onclick="togglePayment('MPTP')">MPTP</button>
  <button id="cashBtn" onclick="togglePayment('Cash')">Cash</button>
</div>
<div id="paymentSelected">Selected: None</div>
</div>
<!-- PRICE -->
<div class="section">
<h3>Price</h3>
<div class="row">
  <button id="meterBtn" onclick="setPriceType('Meter Fare')">Meter Fare</button>
  <button id="setBtn" onclick="setPriceType('Set Price')">Set Price</button>
</div>
<div class="priceBox">
  <span>$</span>
  <input id="price" type="tel" inputmode="numeric" placeholder="Enter amount">
</div>
<div id="priceSelected">Selected: None</div>
</div>
<!-- ACTIONS -->
<div class="section">
<button style="width:100%; background:#10b981;" onclick="dispatch()">DISPATCH</button>
<div style="display:flex; gap:8px;">
  <button style="flex:1;" onclick="sendConfirmation()">Send Confirmation</button>
  <button style="flex:1; background:#8b5cf6;" onclick="sendFollowUp()">Follow Up</button>
</div>
</div>
<!-- JOB HISTORY DROPDOWN - AT BOTTOM -->
<div class="section">
<h3>Recent Jobs</h3>
<select id="jobHistory" onchange="loadSelectedJob()">
  <option value="">-- Select Previous Job --</option>
</select>
</div>
<script>
const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY_HERE"; // <-- Replace here

let jobCount = localStorage.getItem("jobCount");
jobCount = jobCount ? parseInt(jobCount) : 1000;

let selectedVehicle="None";
let selectedTime="None";
let selectedAMPM="None";
let paymentArray=[];
let priceType="None";

let autocompleteService;
let placesService;
let map;

function initializeGoogleMaps() {
  if (!window.google) {
    console.error("Google Maps API not loaded");
    return;
  }
  autocompleteService = new google.maps.places.AutocompleteService();
  map = new google.maps.Map(document.createElement('div'));
  placesService = new google.maps.places.PlacesService(map);
  setupAutocomplete('pickup', 'pickupList');
  setupAutocomplete('drop', 'dropList');
}

function getPlacePredictions(input, callback) {
  const geelong = { lat: -38.14711, lng: 144.36069 };
  const request = {
    input: input,
    componentRestrictions: { country: 'au' },
    location: new google.maps.LatLng(geelong.lat, geelong.lng),
    radius: 60000,
    types: ['geocode', 'establishment']
  };
  autocompleteService.getPlacePredictions(request, (predictions = [], status) => {
    if(status !== google.maps.places.PlacesServiceStatus.OK) {
      callback([]);
      return;
    }
    const suburbPriority = pred => {
      const desc = pred.description.toLowerCase();
      if(desc.includes('geelong')) return 1;
      if(desc.includes('melbourne')) return 2;
      if(desc.includes('vic')) return 3;
      return 4;
    };
    predictions.sort((a,b) => suburbPriority(a) - suburbPriority(b));
    callback(predictions.slice(0, 5));
  });
}

function setupAutocomplete(inputId, listId) {
  const inputElement = document.getElementById(inputId);
  const listElement = document.getElementById(listId);
  let debounceTimer;

  inputElement.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const value = this.value.trim();
    if (value.length < 2) {
      listElement.classList.remove('active');
      return;
    }
    debounceTimer = setTimeout(() => {
      getPlacePredictions(value, (predictions) => {
        listElement.innerHTML = '';
        predictions.forEach((prediction) => {
          const item = document.createElement('div');
          item.className = 'autocomplete-item';
          item.innerHTML = `<span class="pac-icon"></span>${prediction.description}`;
          item.addEventListener('click', () => {
            handleAddressSelected(prediction.place_id, inputId);
            listElement.classList.remove('active');
          });
          listElement.appendChild(item);
        });
        if (predictions.length > 0) listElement.classList.add('active');
        else listElement.classList.remove('active');
      });
    }, 300);
  });

  inputElement.addEventListener('blur', function() {
    setTimeout(() => listElement.classList.remove('active'), 200);
  });
}

// THE ADDRESS FORMAT LOGIC
function handleAddressSelected(placeId, inputId){
  placesService.getDetails({ placeId: placeId }, (place, status) => {
    if (
      status !== google.maps.places.PlacesServiceStatus.OK ||
      !place ||
      !place.address_components
    ) {
      return;
    }
    let street_number="", route="", suburb="", postcode="", town="", locality="", short_state="";
    place.address_components.forEach(comp => {
      if (comp.types.includes('street_number')) street_number = comp.long_name;
      if (comp.types.includes('route')) route = comp.long_name;
      if (comp.types.includes('locality')) suburb = comp.long_name;
      if (comp.types.includes('postal_town')) town = comp.long_name;
      if (comp.types.includes('administrative_area_level_2')) locality = comp.long_name;
      if (comp.types.includes('postal_code')) postcode = comp.long_name;
      if (comp.types.includes('administrative_area_level_1')) short_state = comp.short_name; // Always "VIC"
    });

    let address = "";
    // Compose street and suburb, or just suburb/town/locality
    if (street_number && route) {
      address = `${street_number} ${route}`;
      if (suburb) address += `, ${suburb}`;
      else if (town) address += `, ${town}`;
      else if (locality) address += `, ${locality}`;
    } else {
      address = suburb || town || locality || place.name || "";
    }
    address = address.trim();
    // Now add VIC and postcode if available
    if (address && short_state && postcode) {
      address += ` ${short_state} ${postcode}`;
    } else if (address && postcode) {
      address += ` VIC ${postcode}`;
    } else if (address && short_state) {
      address += ` ${short_state}`;
    }
    document.getElementById(inputId).value = address.trim();
  });
}

/* The rest of your logic (unchanged for brevity), paste your existing or original: */
// -- snip: from original input above --
function titleCase(str){
  return str
    .toLowerCase()
    .split(' ')
    .filter(w=>w)
    .map(w=>w.charAt(0).toUpperCase()+w.slice(1))
    .join(' ');
}
function getTodayDate() {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}
function formatDateDisplay(dateStr) {
  if(!dateStr) return "Today";
  const today = new Date();
  const todayStr = getTodayDate();
  if(dateStr === todayStr) return "Today";
  const date = new Date(dateStr + 'T00:00:00');
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  return date.toLocaleDateString('en-AU', options);
}
function pluralize(count, singular, plural) { count=parseInt(count);if(count===1)return `${count} ${singular}`;return `${count} ${plural}`;}
document.getElementById("time").addEventListener("input", function(e){
  let value = e.target.value.replace(/[^0-9]/g, "");
  if(value.length > 4) value = value.slice(0, 4);
  if(value.length <= 2){
    e.target.value = value;
  } else {
    e.target.value = value.slice(0, 2) + ":" + value.slice(2);
  }
  updateTimeDisplay();
});
function setTime(t){
  selectedTime=t;["quickBtn","readyBtn","laterBtn"].forEach(id=>{document.getElementById(id).classList.remove("glow");});
  if(t==="Quick") quickBtn.classList.add("glow");
  if(t==="Ready Now") readyBtn.classList.add("glow");
  if(t==="Later") laterBtn.classList.add("glow");
  let isLater = t === "Later";
  document.getElementById("date").disabled = !isLater;
  document.getElementById("time").disabled = !isLater;
  document.getElementById("amBtn").disabled = !isLater;
  document.getElementById("pmBtn").disabled = !isLater;
  if(!isLater){
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    selectedAMPM = "None";
    document.getElementById("amBtn").classList.remove("glow");
    document.getElementById("pmBtn").classList.remove("glow");
  }
  timeSelected.innerText="Selected: "+t;
}
function setAMPM(period){
  selectedAMPM=period;
  amBtn.classList.remove("glow");
  pmBtn.classList.remove("glow");
  if(period==="AM") amBtn.classList.add("glow");
  if(period==="PM") pmBtn.classList.add("glow");
  updateTimeDisplay();
}
function updateTimeDisplay(){
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let display="Selected: "+selectedTime;
  if(date) display+=" | Date: "+date;
  if(time) display+=" | Time: "+time;
  if(selectedAMPM!=="None") display+=" "+selectedAMPM;
  timeSelected.innerText=display;
}
document.getElementById("date").addEventListener("change", updateTimeDisplay);
document.getElementById("time").addEventListener("change", updateTimeDisplay);
function setVehicle(v){
  selectedVehicle=v;
  ["sedanBtn","suvBtn","luxBtn","maxiBtn"].forEach(id=>{
    document.getElementById(id).classList.remove("glow");
  });
  if(v==="Sedan") sedanBtn.classList.add("glow");
  if(v==="SUV") suvBtn.classList.add("glow");
  if(v==="Luxury") luxBtn.classList.add("glow");
  if(v==="MAXI") maxiBtn.classList.add("glow");
  vehicleSelected.innerText="Selected: "+v;
}
function togglePayment(p){
  let map={
    "Cabcharge":"cabBtn",
    "Debit/Credit":"cardBtn",
    "MPTP":"mptpBtn",
    "Cash":"cashBtn"
  };
  let btn=document.getElementById(map[p]);
  if(paymentArray.includes(p)){
    paymentArray=paymentArray.filter(x=>x!==p);
    btn.classList.remove("glow");
  } else {
    if(paymentArray.length<2){
      paymentArray.push(p);
      btn.classList.add("glow");
    } else {
      alert("Max 2 payments");
    }
  }
  paymentSelected.innerText=paymentArray.join(", ")||"None";
}
function setPriceType(p){
  priceType=p;
  meterBtn.classList.remove("glow");
  setBtn.classList.remove("glow");
  if(p==="Meter Fare") meterBtn.classList.add("glow");
  if(p==="Set Price") setBtn.classList.add("glow");
  priceSelected.innerText="Selected: "+p;
}
function saveJobToHistory(){
  let name = titleCase(document.getElementById("name").value);
  let phone=document.getElementById("phone").value;
  let pickup=titleCase(document.getElementById("pickup").value);
  let drop=titleCase(document.getElementById("drop").value);
  let adults=document.getElementById("adults").value;
  let kids=document.getElementById("kids").value;
  let luggage=document.getElementById("luggage").value;
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let price=document.getElementById("price").value;
  let job = {
    id: jobCount,
    name, phone, pickup, drop, adults, kids, luggage,
    vehicle:selectedVehicle,
    payment:paymentArray.slice(),
    time:selectedTime,
    date,
    timeInput:time,
    ampm:selectedAMPM,
    priceType,
    price,
    timestamp: new Date().toLocaleString()
  };
  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  jobs.unshift(job);
  jobs = jobs.slice(0, 5);
  localStorage.setItem("jobHistory", JSON.stringify(jobs));
  updateJobHistoryDropdown();
}
function updateJobHistoryDropdown(){
  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  let select = document.getElementById("jobHistory");
  select.innerHTML = '<option value="">-- Select Previous Job --</option>';
  jobs.forEach((job, index) => {
    let option = document.createElement("option");
    option.value = index;
    option.textContent = `${job.name} - ${job.pickup} to ${job.drop}`;
    select.appendChild(option);
  });
}
function loadSelectedJob(){
  let select = document.getElementById("jobHistory");
  let index = select.value;
  if(index === "") return;
  let jobs = JSON.parse(localStorage.getItem("jobHistory")) || [];
  let job = jobs[index];
  if(!job) return;
  document.getElementById("name").value = job.name || "";
  document.getElementById("phone").value = job.phone || "";
  document.getElementById("pickup").value = job.pickup || "";
  document.getElementById("drop").value = job.drop || "";
  document.getElementById("adults").value = job.adults || "";
  document.getElementById("kids").value = job.kids || "";
  document.getElementById("luggage").value = job.luggage || "";
  document.getElementById("date").value = job.date || "";
  document.getElementById("time").value = job.timeInput || "";
  document.getElementById("price").value = job.price || "";
  setVehicle(job.vehicle || "None");
  setTime(job.time || "None");
  setAMPM(job.ampm || "None");
  setPriceType(job.priceType || "None");
  paymentArray = job.payment || [];
  ["cabBtn","cardBtn","mptpBtn","cashBtn"].forEach(id=>{
    document.getElementById(id).classList.remove("glow");
  });
  paymentArray.forEach(p=>{
    if(p==="Cabcharge") cabBtn.classList.add("glow");
    if(p==="Debit/Credit") cardBtn.classList.add("glow");
    if(p==="MPTP") mptpBtn.classList.add("glow");
    if(p==="Cash") cashBtn.classList.add("glow");
  });
  paymentSelected.innerText=paymentArray.join(", ")||"None";
  select.value = "";
}
function dispatch(){
  let name = titleCase(document.getElementById("name").value);
  let phone=document.getElementById("phone").value;
  let pickup=titleCase(document.getElementById("pickup").value);
  let drop=titleCase(document.getElementById("drop").value);
  let adults=document.getElementById("adults").value;
  let kids=document.getElementById("kids").value;
  let luggage=document.getElementById("luggage").value;
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let price=document.getElementById("price").value;
  if(selectedTime === "Later" && !date && time) {
    date = getTodayDate();
  }
  let dateFormatted = formatDateDisplay(date);
  let timeSection = selectedTime === "Later" && date && time
    ? `🪧 *Pickup Time - ${selectedTime}*\n📅 *Date: ${dateFormatted}*\n⏱️ *Time: ${time} ${selectedAMPM}*`
    : `🪧 *Pickup Time - ${selectedTime}*`;
  let passengersSection = `👥 Adults: ${adults || "None"}`;
  if(kids) passengersSection += `\n👥 Kids: ${kids}`;
  if(luggage) passengersSection += `\n👜 Luggage: ${luggage}`;
  let message=
`🚖 TAXI DISPATCH
🆔 JOB-${jobCount}
⏰ ${new Date().toLocaleString()}
${timeSection}
👤 ${name}
📞 ${phone}
🚗 ${selectedVehicle}
💳 ${paymentArray.join(", ")}
💲 ${priceType} ${price ? "$"+price : ""}
${passengersSection}
📍 Pickup: ${pickup}
📍 Drop: ${drop}`;
  navigator.clipboard.writeText(message);
  saveJobToHistory();
  alert("Copied ✔");
  jobCount++;
  localStorage.setItem("jobCount", jobCount);
  window.open("https://chat.whatsapp.com/Fiu6m7Uvlcz0TN49jkV30D?mode=gi_t","_blank");
}
function sendConfirmation(){

Vehicle: ${selectedVehicle}

Thank you for choosing our service.

For Bookings & Inquiries:
0420 303 581
0450 678 194

  } else {

`Hi ${name},

  let name = titleCase(document.getElementById("name").value);
  let phone = document.getElementById("phone").value.replace(/\s+/g,'');
  if(!name || !phone) {
    alert("Please enter Passenger Name and Phone Number");
    return;
  }
  let msg =
`Hi ${name},

Thanks for riding with Geelong City Cabs today.
We're here 24/7 for all your travel needs.

For Bookings & Inquiries:
0420 303 581
0450 678 194
www.geelongcitytaxicab.com.au`;

window.addEventListener("DOMContentLoaded", function(){
  updateJobHistoryDropdown();
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyDMA_Frd6ut6hv4s0YnoWoYdI4hRoEWZs4&libraries=places`;
  script.async = true;
  script.defer = true;
  script.onload = initializeGoogleMaps;
  document.head.appendChild(script);
});
</script>
</body>
